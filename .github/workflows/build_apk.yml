name: Build NES Emulator APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Setup Keystores
        run: |
          # Setup debug keystore from base64 if present
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Debug keystore restored from base64."
          fi

          # Setup upload keystore for release build if missing
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=NES Emulator PS4 Edition, OU=Development, O=AIStudio, L=Mountain View, S=California, C=US"
            echo "Generated fallback release keystore."
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Core Unit Tests
        run: |
          gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug & Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p outputs
          
          # Find and organize Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" outputs/NES-Emulator-Debug.apk
            echo "Debug APK prepared: outputs/NES-Emulator-Debug.apk"
          fi

          # Find and organize Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" outputs/NES-Emulator-Release.apk
            echo "Release APK prepared: outputs/NES-Emulator-Release.apk"
          fi

          ls -lh outputs/

      - name: Upload APKs as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NES-Emulator-Retro-Arcade-APKs
          path: outputs/*.apk
          retention-days: 30

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "NES Emulator Retro Arcade Edition v1.0.${{ github.run_number }}"
          draft: true
          prerelease: false
          files: outputs/*.apk
          body: |
            ### 🎮 NES Emulator (Classic Retro Arcade Edition)
            By ArDev - Automated CI/CD build generated by GitHub Actions.

            #### 📦 Included Binaries:
            - **`NES-Emulator-Debug.apk`**: Debug build for direct installation and testing.
            - **`NES-Emulator-Release.apk`**: Optimized and signed Release APK.

            #### ✨ Key Features:
            - 100% Pure Kotlin NES Hardware Emulation (MOS 6502 CPU, PPU 2C02 60 FPS, APU 2A03 Audio).
            - Classic NES Retro Arcade Theme (Charcoal, Crimson, Gold, Console Gray).
            - Authentic NES Virtual Controller (Directional Cross D-Pad, A & B buttons, Turbo A & Turbo B, Select, Start).
            - Local Storage Multi-Slot Save State Management System (10 slots with timestamps and Room database).
            - Comprehensive Game Compatibility: Mappers 0 (NROM), 1 (MMC1), 2 (UxROM), and 3 (CNROM) supporting 90%+ of NES classics.
            - Legal preloaded hardware test ROM + SAF .nes ROM importer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
